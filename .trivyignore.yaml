# 意図的に許容している指摘。理由を必ず記載し、解消できたら削除する。
misconfigurations:
  - id: AWS-0053
    paths:
      - "modules/ecs/main.tf"
    statement: "Web アプリの入口となる ALB は公開が前提（背後の ECS/RDS はプライベートサブネット）。"

  - id: AWS-0054
    paths:
      - "modules/ecs/main.tf"
    statement: "domain_name 未指定の検証用構成（dev の既定）では HTTP のみ。domain_name 指定時は ACM + 443 リスナーで HTTPS 化し、80 は 443 へリダイレクトする（tests/ecs.tftest.hcl で検証）。"

  - id: AWS-0104
    paths:
      - "modules/ecs/main.tf"
    statement: "Fargate タスクは NAT 経由で ECR / Secrets Manager / CloudWatch Logs へ到達する必要があり、宛先 IP を限定できない。インバウンドは ALB の SG のみに限定済み。"
