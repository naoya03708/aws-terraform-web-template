name: terraform-plan

# PR 上で dev / prod の plan を OIDC 認証（長期キー不要）で実行し、結果を PR コメントに出す。
# リポジトリ変数 AWS_PLAN_ROLE_ARN / AWS_REGION が未設定の間はスキップされる。
on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.hcl"
      - ".github/workflows/terraform-plan.yml"
      - ".github/actions/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    # fork からの PR には AWS 権限を渡さない
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    env:
      ENV: ${{ matrix.env }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TG_NON_INTERACTIVE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: terragrunt plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terragrunt plan -no-color -input=false -lock-timeout=60s 2>&1 | tee plan.txt

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v9
        env:
          ENV_NAME: ${{ matrix.env }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            let out = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : '(no output)';
            const max = 60000;
            if (out.length > max) out = '... (truncated)\n' + out.slice(-max);
            const marker = `<!-- terraform-plan-${env} -->`;
            const icon = process.env.OUTCOME === 'success' ? '✅' : '❌';
            const body = [
              marker,
              `### ${icon} terragrunt plan (\`${env}\`)`,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              out,
              '```',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const prev = comments.find((c) => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1
