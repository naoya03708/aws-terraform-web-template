version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-tools"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - "/"
      - "/modules/*"
      - "/bootstrap/github-oidc"
    schedule:
      interval: weekly
